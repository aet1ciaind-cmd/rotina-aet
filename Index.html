:root{
  --bg:#202020; --card:#2a2a2a; --card-2:#333333; --ink:#ffffff; --muted:#b4b4b4; --line:#3d3d3d; --graf:#202020;
  --caqui:#9b8a5c; --caqui-2:#b5a576; --caqui-esc:#6f6342;
  --red:#9b8a5c; --red-2:#b5a576; --gold:#9b8a5c; --gold-2:#c4b688;
  --ok:#4caf6e; --warn-bg:#1d1a10; --warn-ink:#d8cba0; --late:#c62828;
  --d:#202020; --s:#202020; --m:#202020; --p:#c62828; --a:#202020;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'PMMG Texto','Segoe UI',Arial,sans-serif}
button,input,select{font:inherit}
a{color:var(--gold-2)}
header{background:#1a1a1a;border-bottom:4px solid var(--caqui);padding:14px 20px;position:relative}
header:after{display:none}
.hwrap{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px;letter-spacing:.3px;color:#fff}
header h1 span{color:var(--gold)}
header .sub{color:var(--muted);font-size:14px}
.who{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.who input{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);width:200px}
.who input:focus,.obs input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;margin-top:3px}
nav .nwrap{max-width:1000px;margin:0 auto;display:flex;overflow-x:auto}
nav button{background:none;border:0;padding:14px 18px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--gold);border-bottom-color:var(--red)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:18px;margin:26px 0 10px;color:#fff;border-left:4px solid var(--red);padding-left:10px}
h2:first-child{margin-top:4px}
.daybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:10px 14px}
.daybar .big{font-size:20px;font-weight:700;flex:1;min-width:200px;color:#fff}
.btn{border:1px solid var(--line);background:var(--card-2);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:hover{border-color:var(--gold);color:var(--gold-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--caqui);color:#202020;border-color:var(--caqui);font-weight:600}
.btn.primary:hover{background:var(--caqui-2);color:#202020;border-color:var(--caqui-2)}
select.btn option{background:var(--card-2);color:var(--ink)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border:1px solid #4a3c14;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
.task{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;display:grid;grid-template-columns:34px 1fr;gap:4px 12px}
.task.done{background:#121a14;border-color:#24452f}
.task.done .ttl{color:var(--muted);text-decoration:line-through}
.task.late{border-left:5px solid var(--late)}
.chk{width:26px;height:26px;margin-top:2px;cursor:pointer;accent-color:var(--ok)}
.ttl{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.chip{font-size:12px;font-weight:700;color:#fff;border-radius:20px;padding:2px 9px;letter-spacing:.3px;border:1px solid var(--caqui)}
.chip.PRAZO{border-color:#c62828}
.chip.Diária{background:var(--d)}.chip.Semanal{background:var(--s)}.chip.Mensal{background:var(--m)}
.chip.PRAZO{background:var(--p)}.chip.Aviso{background:var(--a)}
.actions{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.how{grid-column:2;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.doneby{grid-column:2;font-size:13px;color:var(--ok);margin-top:6px}
.obs{grid-column:2;margin-top:8px}
.obs input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--card-2);color:var(--ink)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);margin:8px 0}
table.steps{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px;background:var(--card)}
table.steps th,table.steps td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.steps th{background:var(--card-2);color:var(--gold)}
table.steps td:first-child{width:36px;text-align:center;font-weight:700;color:var(--gold)}
table.steps td:nth-child(2){width:30%;color:var(--muted)}
.proc h3{font-size:15px;margin:12px 0 4px;color:var(--gold)}
.proc p{margin:4px 0 8px}
.proc b{color:#fff}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:10px 0}
details summary{cursor:pointer;padding:12px 14px;font-weight:600}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
details .body{padding:0 14px 12px}
.progress{height:10px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 2px}
.progress div{height:100%;background:var(--caqui)}
.week{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.week h3{margin:0;padding:10px 14px;background:var(--card-2);font-size:15px;color:var(--gold);border-bottom:1px solid var(--line)}
.cday{padding:8px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:120px 1fr;gap:8px}
.cday.today{background:#1d1a10;box-shadow:inset 4px 0 0 var(--caqui)}
.cday .d{font-weight:600;font-size:14px}
.citem{font-size:14px;display:flex;gap:8px;align-items:flex-start;margin:2px 0}
.citem .st{width:18px;flex:none}
.citem.ok{color:var(--muted)}
.tpl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.tpl pre{white-space:pre-wrap;background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.5 'PMMG Texto','Segoe UI',Arial,sans-serif;margin:8px 0;color:var(--ink)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;font-size:15px}
.kv b{color:var(--gold);font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#202020;font-weight:600;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);align-items:center}
/* ---- caixas de tarefa em caqui (MIV PMMG) ---- */
.task{background:var(--caqui);border-color:#7f704a;color:#202020}
.task .ttl{color:#202020}
.task .meta{color:#2b2516}
.task.done{background:var(--caqui-esc);border-color:#57502f}
.task.done .ttl{color:#e6dfc8}
.task.done .meta{color:#d6cdb0}
.task.done .doneby{color:#fff}
.task.done .btn{border-color:#e6dfc8;color:#e6dfc8}
.task.done .chk{accent-color:#202020}
.task.late{border-left-color:#c62828}
.task .btn{background:transparent;border-color:#202020;color:#202020}
.task .btn:hover{background:#202020;color:#fff;border-color:#202020}
.task .btn.primary{background:#202020;border-color:#202020;color:#fff}
.task .btn.primary:hover{background:#3a3a3a;color:#fff}
.task .doneby{color:#0f3d1f;font-weight:700}
.task .obs input{background:#e8e1cc;border-color:#57502f;color:#202020}
.task .obs input::placeholder{color:#5a5136}
.task .how{border-top-color:#2b2516}
.task .proc h3{color:#202020;text-transform:uppercase;font-size:14px;letter-spacing:.3px}
.task .proc b{color:#202020}
.task table.steps{background:#f3efe3}
.task table.steps th,.task table.steps td{border-color:#7f704a;color:#202020}
.task table.steps th{background:#202020;color:#fff}
.task table.steps td:first-child{color:#202020}
.task table.steps td:nth-child(2){color:#3a3220}
.task .tpl{background:#e8e1cc;border-color:#7f704a;color:#202020}
.task .tpl pre{background:#f7f4ea;border-color:#7f704a;color:#202020}
.task .kv b{color:#202020}
.task .chk{accent-color:#202020}
.task .chip{border-color:#202020}
header h1,h2,.daybar .big,nav button,.chip,.week h3,.proc h3,details summary,.btn.primary,.tpl>b{font-family:'PMMG Titulo','PMMG Texto',Arial,sans-serif;font-weight:400;letter-spacing:.4px}
header h1{font-size:22px;text-transform:uppercase}
nav button{text-transform:uppercase;font-size:14px}
.chip{font-size:11px}
/* ---- cabeçalho no modelo PMMG ---- */
header{background:none!important;border:0!important;padding:0!important}
.htop{background:#000;padding:22px 20px 20px}
.htop h1{color:#fff;font-size:30px;margin:0;text-transform:uppercase}

/* ================= CORPO NO MODELO DE SLIDE PMMG ================= */
:root{--bg:#f3f0e7;--card:#fbfaf5;--card-2:#e9e4d6;--ink:#000;--muted:#4f4b42;--line:#d2cab6;--warn-bg:#f4ead0;--warn-ink:#4f3f10}
html{color-scheme:light}
body{background:#f3f0e7;color:#000}
*{font-family:'Rawline',Arial,Helvetica,sans-serif!important;letter-spacing:normal}
a{color:#5e5338}
nav{background:#000!important;border-bottom:0}
nav button{color:#cfcfcf;font-weight:700}
nav button:hover{color:#fff}
nav button.on{color:#9b8a5c;border-bottom-color:#9b8a5c}
.corpo{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:calc(100vh - 53px)}
.trilho{background:#000;border-right:5px solid #9b8a5c;box-shadow:2px 0 0 #2e2d2c,4px 0 6px rgba(0,0,0,.28)}
.trilho-esc{position:fixed;left:30px;bottom:18px;width:76px;height:auto;z-index:4;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
main{max-width:1060px;margin:0;padding:28px 40px 60px 56px;width:100%}
.sl-tit h1{font-weight:700;font-size:clamp(30px,4.4vw,48px);line-height:1.05;text-transform:uppercase;color:#000;margin:6px 0 6px;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.sl-sub{text-transform:uppercase;font-size:14px;color:#000;margin-bottom:22px}
h2{color:#000;font-weight:700;text-transform:uppercase;font-size:16px;border-left:0;padding-left:0}
.daybar{background:transparent;border:0;padding:0;justify-content:flex-start}
.daybar .big{display:none}
.btn{background:#fbfaf5;border-color:#bdb39a;color:#000}
.btn:hover{border-color:#000;color:#000;background:#fff}
.btn.primary{background:#000;color:#fff;border-color:#000}
.btn.primary:hover{background:#2a2a2a;color:#fff}
.empty{background:#fbfaf5;border-color:#cfc6b0;color:#4f4b42}
details{background:#fbfaf5;border-color:#d2cab6}
.week{background:#fbfaf5;border-color:#d2cab6}
.week h3{background:#000;color:#fff;border-bottom:0;font-weight:700;text-transform:uppercase;font-size:13px}
.cday.today{background:#ece4cc;box-shadow:inset 4px 0 0 #9b8a5c}
.cday .d a{color:#000}
.proc h3{color:#000;font-weight:700;text-transform:uppercase;font-size:13px}
.proc b{color:#000}
table.steps{background:#fff}

table.steps td:first-child{color:#000}
.kv b{color:#000;font-weight:700}
.tpl{background:#fbfaf5}
.tpl pre{background:#fff;color:#000}
.progress{background:#e3ddcc;border-color:#cfc6b0}
.toast{background:#000;color:#fff}
.foot{border-top:0;margin-top:14px}
.sl-rod{display:flex;flex-direction:column;align-items:flex-start;margin-top:44px}
.sl-rod span{font-weight:700;text-transform:uppercase;font-size:14px;margin-bottom:4px}
.sl-rod svg{width:386px;max-width:calc(100% + 56px);height:24px;margin-left:-56px;display:block}
@media (max-width:820px){.corpo{grid-template-columns:14px minmax(0,1fr)}.trilho-esc{display:none}main{padding:20px 16px 50px}}

/* ================= REFINAMENTO: FOLHA ÚNICA ================= */
body{background:#d8d3c6}
.folha{max-width:1000px;margin:20px auto 40px;background:#f3f0e7;box-shadow:0 10px 40px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.08)}
header.miv{padding:0!important}
.miv-wrap{max-width:none;margin:0 -3.6% 0 -3.5%}
.miv-band{margin:0 3.546% 0 3.445%}
nav{position:sticky;top:0;background:#000!important}
nav .nwrap{max-width:none;padding-left:76px}
nav button{padding:15px 20px;font-size:13px;letter-spacing:.3px}
.corpo{min-height:auto;grid-template-columns:72px minmax(0,1fr)}
.trilho{position:relative}
.trilho-esc{position:sticky;top:calc(100vh - 118px);left:auto;bottom:auto;display:block;width:84px;margin:0 0 18px 18px}
main{max-width:none;padding:34px 48px 40px 52px}
.sl-tit{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:24px}
.sl-tit h1{margin:0 0 6px}
.sl-sub{margin:0;color:#3d3a33;letter-spacing:.4px}
.daynav{display:flex;gap:6px;flex:none}
.daynav .btn{min-width:42px;justify-content:center;font-size:18px;padding:6px 12px;background:#000;color:#fff;border-color:#000;font-weight:700}
.daynav .btn:hover{background:#9b8a5c;border-color:#9b8a5c;color:#000}
.daynav .btn:disabled{background:#bbb;border-color:#bbb}
.daynav .btn[data-nav="0"]{font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 6px}
.kpi{background:#000;color:#fff;padding:14px 16px 12px;border-bottom:4px solid #9b8a5c;clip-path:polygon(0 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px))}
.kpi span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#bdb29a}
.kpi b{display:block;font-size:30px;line-height:1.1;margin-top:4px;color:#fff}
.kpi b small{font-size:16px;color:#9b8a5c;font-weight:700}
.kpi em{display:block;font-style:normal;font-size:12px;color:#bdb29a;margin-top:2px}
.kpi.alerta{border-bottom-color:#c62828}
.kpi.alerta b{color:#ff8a80}
h2{display:flex;align-items:center;gap:12px;margin:30px 0 12px;font-size:14px;letter-spacing:.6px}
h2:after{content:"";flex:1;height:1px;background:#9b8a5c}
/* caixas de tarefa: caqui, mais limpas */
.task{border:0;border-radius:0;padding:16px 18px;grid-template-columns:30px 1fr;box-shadow:0 1px 0 rgba(0,0,0,.18);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.task .ttl{font-weight:700;font-size:15.5px;line-height:1.4}
.task .meta{font-size:12px}
.task .chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid #000;background:#f3f0e7;border-radius:3px;display:grid;place-content:center;margin-top:1px}
.task .chk:checked{background:#000}
.task .chk:checked:after{content:"✓";color:#9b8a5c;font-weight:700;font-size:17px;line-height:1}
.task .btn{font-size:13px;padding:6px 11px;border-radius:4px}
.task.late{box-shadow:inset 5px 0 0 #c62828,0 1px 0 rgba(0,0,0,.18)}
.task.done{opacity:.92}
.chip{border-radius:3px;font-size:10.5px;padding:2px 7px;letter-spacing:.5px}
.empty{border-radius:0;border-style:solid;border-color:#d2cab6}
details{border-radius:0}
.week{border-radius:0}
.tpl{border-radius:0}
.btn{border-radius:4px}
.foot{font-size:13px}
.sl-rod{margin-top:30px}
@media (max-width:820px){.folha{margin:0}.miv-wrap{margin:0}.miv-band{margin:0}nav .nwrap{padding-left:0}.kpis{grid-template-columns:1fr}.sl-tit{flex-wrap:wrap}main{padding:20px 16px 40px}.trilho-esc{display:none}}

.task{row-gap:2px}

/* ================= TIPOGRAFIA RAWLINE ================= */
body,p,span,td,li,input,select,textarea,pre,.sl-sub,.miv-info,.foot,.meta,.empty,.kpi em,.kpi span,.btn{font-weight:300}
b,strong,.task .ttl,.kv b,table.steps th,.doneby,.citem .chip,.cday .d{font-weight:700}
h1,h2,h3,header.miv h1.miv-tit,.sl-tit h1,nav button,.chip,.kpi b,.week h3,.proc h3,details summary,.btn.primary,.daynav .btn,.tpl>b,.sl-rod span{font-weight:900!important}
.sl-tit h1{text-shadow:none;letter-spacing:-.3px}
header.miv h1.miv-tit{letter-spacing:.2px}
.task .ttl{font-size:15px}
.task .meta,.task .btn{font-weight:400}
.btn.primary,.task .btn.primary{font-weight:700!important}

/* ---- resumo em 3 botões compactos ---- */
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 4px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;background:#000;color:#fff;padding:8px 14px;border-bottom:3px solid #9b8a5c;clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));transition:background .15s}
.kpi:hover{background:#2a2a2a}
.kpi:focus-visible{outline:2px solid #9b8a5c;outline-offset:2px}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#bdb29a;font-weight:400}

.kpi b small{font-size:12px;color:#9b8a5c;font-weight:700}
.kpi.alerta{border-bottom-color:#c62828}
.kpi.alerta b{color:#ff8a80}
h2[id]{scroll-margin-top:64px}

.task{position:relative;border:1px solid #84754d!important}

  background:linear-gradient(to bottom left,transparent calc(50% - .8px),#84754d calc(50% - .8px),#84754d calc(50% + .8px),transparent calc(50% + .8px))}
.task.done{border-color:#5f5538!important}

/* ---- quadros do "Como fazer" no padrão caqui das tarefas ---- */
details.cx{position:relative;background:#9b8a5c;border:1px solid #84754d;border-radius:0;color:#1f1a0f;box-shadow:0 1px 2px rgba(0,0,0,.08);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}

  background:linear-gradient(to bottom left,transparent calc(50% - .8px),#84754d calc(50% - .8px),#84754d calc(50% + .8px),transparent calc(50% + .8px))}

function textos(sem){
  const p=sem?br(sem.ini)+' a '+br(sem.fim):'dd/mm/aaaa a dd/mm/aaaa';
  const ter=sem?br(add(sem.ini,1)):'xx/xx/2026';
  const it0=sem?instrDe(sem.ini):null, tema=it0?it0.eixo+' – '+it0.tema:'';
  const seg2=sem?br(sem.ini):'xx/xx/2026';
  const motivo=(sem&&semTrein(add(sem.ini,1)))?'em virtude do empenho de efetivo no policiamento do 2º turno das Eleições/2026 e dos feriados, conforme publicação do PM1/EMPM, não haverá Treinamento Semanal no período de 19/10/2026 a 06/11/2026 (instrução do dia '+ter+' cancelada).':'em virtude do xxxxxxxxxxxxxx, não haverá instrução semanal no dia xx/xx/xxxx.';
  return {
    conf:{assunto:'INSTRUÇÃO SEMANAL '+ter,
      texto:'Senhoras e Senhores,\nBom dia.\n\nCom meus cordiais cumprimentos,\n\nIncumbiu-me Sra. Cap PM. Subcomandante da 1ª Cia PM Ind de informar que haverá instrução semanal no dia '+ter+' para todos os militares excetuando-se os que estiverem de férias, licença, dispensa, de serviço no dia ou saindo do 41 (Dispensa da Grande folga a critério do chefe direto)\n\n\nData: '+ter+' (Terça Feira)\nHorário: 09h00 às 11h30\nLocal: Auditório Sede da 1ª Cia PM Ind\nUniforme: \nInstrutor: \nTema: '+tema+'\nPúblico Alvo: Todos os militares, exceção aos que estiverem de férias/licença, de serviço, ou saindo do 4º- 1º.\n\nIMPORTANTE: Todos os comandantes de pelotão e chefes diretos deverão encaminhar à caixa da AET/1 Cia PM Ind, o RELATÓRIO DE ALOCAÇÃO CAD ESCALA, contendo os dados dos militares (nome completo e nº de polícia), para confecção da lista de chamada (formulário link).\n\nPRAZO PARA ENVIO DA ESCALA: '+seg2+' (segunda-feira) - 10h00\n\nQualquer dúvida estamos à disposição.\nSubscrevo mui respeitosamente,\nASPM Andreia de Fátima Oliveira Procópio - Aux. S.Adm'},
    canc:{assunto:'INSTRUÇÃO SEMANAL '+ter+' - NÃO HAVERÁ',
      texto:'Senhoras e senhores,\nBom dia.\n\nCom meus cordiais cumprimentos,\n\nIncumbiu-me Sr. Tenente Giovani, chefe da S.Adm, de informar que, '+motivo+'\n\nQualquer dúvida estamos à disposição.\nSubscrevo mui respeitosamente,\nASPM Andreia de Fátima Oliveira Procópio - Aux. S.Adm'}
  };
}

/* ---------- gráfico da situação do TPB (aba Pendências) ---------- */
function graficoTPB(){
  const CAT=[['ap','Aprovado','#2e7d32'],['rv','Aprovado na reavaliação','#7cb342'],['rp','Reprovado (acompanhar)','#c62828'],['sr','Turma encerrada sem resultado','#ef6c00'],['fu','Turma a realizar','#78909c']];
  const cl=r=>{if(/REPROVAD/i.test(r.tpb))return /^\s*APROVAD/i.test(r.reav)?'rv':'rp';if(/APROVAD/i.test(r.tpb))return 'ap';return (r.fim&&r.fim<HOJE)?'sr':'fu'};
  const rows=CTRL.filter(r=>r.ini);
  if(!rows.length)return '';
  const cont=rs=>{const c={ap:0,rv:0,rp:0,sr:0,fu:0};rs.forEach(r=>c[cl(r)]++);return c};
  const barra=(c,n,alt)=>'<div role="img" aria-label="'+alt+'" style="display:flex;height:'+(n>40?'26px':'20px')+';border-radius:4px;overflow:hidden;background:#e6e1d4">'+CAT.map(([k,l,cor])=>c[k]?'<div title="'+l+': '+c[k]+'" style="width:'+(c[k]/n*100)+'%;background:'+cor+'"></div>':'').join('')+'</div>';
  const txt=c=>CAT.filter(x=>c[x[0]]).map(x=>c[x[0]]+' '+x[1].toLowerCase()).join(' · ');
  const tot=cont(rows),N=rows.length;
  const turmas=[...new Set(rows.map(r=>r.ini))].sort();
  let h='<h2>Situação do TPB</h2>';
  h+='<div class="tpl" style="margin-bottom:14px"><div style="margin-bottom:8px"><b>Total: '+N+' militares</b></div>'+barra(tot,N,'Situação geral do TPB: '+txt(tot))+
    '<div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px">'+CAT.map(([k,l,cor])=>'<span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:'+cor+';margin-right:6px;vertical-align:-1px"></span>'+l+': <b>'+tot[k]+'</b> ('+Math.round(tot[k]/N*100)+'%)</span>').join('')+'</div></div>';
  h+='<details><summary>Situação por turma ('+turmas.length+')</summary><div class="body">'+turmas.map(ini=>{const rs=rows.filter(r=>r.ini===ini),c=cont(rs);return '<div style="margin:0 0 10px"><div style="font-size:14px;margin-bottom:3px"><b>'+brc(ini)+' a '+brc(rs[0].fim)+'</b> · '+rs.length+' militares · <span class="mm">'+txt(c)+'</span></div>'+barra(c,rs.length,'Turma '+brc(ini)+': '+txt(c))+'</div>'}).join('')+'</div></details>';
  return h;
}

let view='hoje', dia=null;
function diaPadrao(){
  if(DIAS_UTEIS.includes(HOJE))return HOJE;
  const prox=DIAS_UTEIS.find(d=>d>HOJE);return prox||DIAS_UTEIS[DIAS_UTEIS.length-1];
}
function telaHoje(){
  if(!dia)dia=diaPadrao();
  const i=DIAS_UTEIS.indexOf(dia);
  let h='';
  window._daynav='<div class="daynav"><button class="btn" data-nav="-1" '+(i<=0?'disabled':'')+' title="Dia anterior">‹</button>'+
    (dia!==diaPadrao()?'<button class="btn" data-nav="0">Hoje</button>':'')+
    '<button class="btn" data-nav="1" '+(i>=DIAS_UTEIS.length-1?'disabled':'')+' title="Próximo dia">›</button></div>';
  const ts=doDia(dia),feitas=ts.filter(t=>state.done[t.id]).length;
  const ref0=HOJE<dia?HOJE:dia, nAtr=tasks.filter(t=>t.date<ref0&&t.date>=INICIO&&!state.done[t.id]).length;
  const pz=tasks.find(t=>t.tipo==='PRAZO'&&t.date>=dia&&!state.done[t.id]);
  h+='<div class="kpis"><button class="kpi" data-kpi="sec-dia"><span>Feitas no dia</span><b>'+feitas+'<small>/'+ts.length+'</small></b></button>'+
     '<button class="kpi'+(nAtr?' alerta':'')+'" data-kpi="sec-atr"><span>Atrasadas</span><b>'+nAtr+'</b></button>'+
     '<button class="kpi" data-kpi="'+(pz?'dia:'+pz.date:'')+'"><span>Próximo prazo</span><b>'+(pz?brc(pz.date)+' <small>'+DIAS[dow(pz.date)].slice(0,3)+'</small>':'—')+'</b></button></div>';
  h+='<h2 id="sec-dia">Tarefas do dia</h2>'+(ts.length?ts.map(t=>card(t)).join(''):'<div class="empty">Sem tarefas neste dia.</div>');
  const ref=HOJE<dia?HOJE:dia;
  const atras=tasks.filter(t=>t.date<ref&&t.date>=INICIO&&!state.done[t.id]);
  const lim=add(dia,7);
  const prox=tasks.filter(t=>(t.tipo==='PRAZO'||t.tipo==='Mensal'||t.tipo==='Aviso')&&t.date>dia&&t.date<=lim);
  h+='<h2>Próximos prazos (7 dias)</h2>'+(prox.length?prox.map(t=>'<div class="empty" style="color:var(--ink);border-style:solid;border-left:4px solid var(--p)"><b>'+DIAS[dow(t.date)]+', '+brc(t.date)+'</b> · '+esc(t.titulo)+'</div>').join(''):'<div class="empty">Nenhum prazo nos próximos 7 dias.</div>');
  h+='<h2 id="sec-atr">'+ic('alerta')+' Atrasadas ('+atras.length+')</h2>';
  if(!atras.length)h+='<div class="empty">Nada atrasado.</div>';
  else h+='<details'+(atras.length<=6?' open':'')+'><summary>Tarefas de dias anteriores que não foram marcadas como feitas'+(atras.length>6?' (clique para ver)':'')+'</summary><div class="body">'+atras.map(t=>card(t,true)).join('')+'</div></details>';
  return h;
}
function telaCal(){
  const tot=tasks.length,ok=tasks.filter(t=>state.done[t.id]).length;
  let h='<h2>Progresso</h2><div>'+ok+' de '+tot+' tarefas feitas ('+Math.round(ok/tot*100)+'%)</div><div class="progress"><div style="width:'+(ok/tot*100)+'%"></div></div>';
  h+='<p style="font-size:14px;color:var(--muted)">Clique em um dia para abrir as tarefas dele. Feriados sem tarefas: 02/11, 20/11 e 25/12.</p>';
  const semanas={};
  for(const d of DIAS_UTEIS){const seg=add(d,1-dow(d));(semanas[seg]=semanas[seg]||[]).push(d)}
  for(const seg in semanas){
    h+='<div class="week"><h3>Semana de '+brc(seg)+' a '+brc(add(seg,4))+'</h3>';
    for(const d of semanas[seg]){
      const ts=doDia(d);
      h+='<div class="cday'+(d===HOJE?' today':'')+'"><div class="d"><a href="#" data-goto="'+d+'">'+DIAS[dow(d)]+'<br>'+brc(d)+'</a></div><div>'+
        ts.map(t=>{const ok=!!state.done[t.id];return '<div class="citem'+(ok?' ok':'')+'"><span class="st">'+(ok?ic('ok'):(d<HOJE?ic('alerta'):ic('vazio')))+'</span><span><span class="chip '+t.tipo+'">'+t.tipo+'</span> '+esc(t.titulo)+'</span></div>'}).join('')+'</div></div>';
    }
    h+='</div>';
  }
  return h;
}

  }
  return h;
}
function telaPend(){
  const hoje=HOJE,lim=add(HOJE,14),L=(r,x)=>'<tr><td>'+br(r.ini)+' a '+brc(r.fim)+'</td><td>'+esc(r.n)+'</td><td>'+esc(r.pg)+' '+esc(r.nome)+'</td>'+x+'</tr>';
  const tab=(tit,oque,cab,linhas)=>'<h2>'+tit+' ('+linhas.length+')</h2><p class="mm" style="font-size:14px">'+oque+'</p>'+(linhas.length?'<div class="mtab"><table><tr><th>Turma</th><th>Nº</th><th>Militar</th>'+cab.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+linhas.join('')+'</table></div>':'<div class="empty">Nenhuma pendência.</div>');
  const a=CTRL.filter(r=>r.fim&&r.fim<hoje&&!r.tpb).map(r=>L(r,'<td>—</td>'));
  const b=CTRL.filter(r=>r.ini&&r.ini>=hoje&&r.ini<=lim&&r.sici.toLowerCase()!=='ok').map(r=>L(r,'<td>'+esc(r.cfd||'—')+'</td><td>'+esc(r.cfr||'—')+'</td><td>'+esc(r.sici||'—')+'</td>'));
  const d=CTRL.filter(r=>/REPROVAD/i.test(r.tpb)&&!/^\s*APROVAD/i.test(r.reav)).map(r=>L(r,'<td>'+esc(r.tpb)+'</td><td>'+esc(r.cfrv||'—')+'</td><td>'+esc(r.cfr2||'—')+'</td><td>'+esc(r.reav||'—')+'</td>'));
  return graficoTPB()+tab('Turmas já encerradas sem resultado do TPB','Consultar no SICI (PESQUISA MILITAR) e preencher RESULTADO TPB na aba CONTROLE_TPB. Reprovado = providências.',[ 'Resultado TPB'],a)+
    tab('Turmas dos próximos 14 dias sem CF lançado no SICI','Lançar o CF no SICI antes da turma (Como fazer › SICI, item B) e marcar "ok" na coluna CF SICI.',['Data CF','Resultado CF','CF SICI'],b)+
    tab('Reprovados no TPB – acompanhar reavaliação','Verificar o CF de reavaliação e a data da reavaliação (aguarda confirmação do CTP). Quem aparece APROVADO na reavaliação sai da lista (ciclo fechado).',['Resultado TPB','CF reavaliação','Resultado CF','Reavaliação'],d)+
    '<p class="mm" style="margin-top:14px">Para ver correções feitas na planilha, recarregue esta página.</p>';
}
function telaInfo(){
  const L=k=>'<a class="btn" target="_blank" rel="noopener" href="'+LINKS[k].u+'">'+ic(LINKS[k].i)+' '+LINKS[k].t+'</a>';
  return '<h2>Links</h2><div class="actions" style="margin:0">'+L('controle')+L('pendencias')+L('psopm')+L('tta')+'</div>'+
  '<h2>Quem é quem</h2><div class="kv"><b>Chefe da S.Adm</b><span>Ten Giovani · despacho dos pedidos de curso (caixa PA)</span><b>Subcomandante</b><span>Despacho da instrução semanal; divulgação de vagas de curso</span><b>Cmt de Pelotão</b><span>Divulgação de vagas de curso</span><b>Ten Guenael</b><span>Lança os Controles Fisiológicos no PSOPM</span><b>Ten Thiago</b><span>Instrutor do APCAF</span><b>CTP</b><span>Lança o resultado do TPB no SICI</span><b>P1</b><span>Informar datas do APCAF (escala de supervisão/CPU)</span></div>'+
  '<h2>Auditório para instruções</h2><div class="kv"><b>Como pedir</b><span>E-mail a partir da conta sadm1ciapmind@gmail.com (senha: pedir à chefia)</span><b>Associação Comercial</b><span>recepcao@acenovalima.com.br · (31) 3541-2614</span><b>Sindicato dos Mineiros</b><span>financeiro1@sindmineiros.com.br · (31) 3541-2255 (Sérgio)</span></div>'+
  '<h2>APCAF</h2>'+INFO_TCAF;
}
const TIT={pend:['Pendências TPB',()=>'Calculadas agora a partir da aba CONTROLE_TPB'],mil:['Militares TPB',()=>'Convocados com prazos de EAD e Orientações no período das férias'],hoje:['Tarefas do dia',()=>(dia===HOJE?'Hoje · ':'')+longo(dia)],cal:['Calendário',()=>'Período completo das férias'],como:['Como fazer',()=>'Passo a passo de cada atividade'],modelos:['Modelos de mensagem',()=>'Caixa geral PA 1ª Cia PM Ind'],info:['Contatos e links',()=>'Quem é quem, auditório e APCAF']};
function render(){
  copiaN=0;for(const k in COPIA)delete COPIA[k];
  const tela={pend:telaPend,mil:telaMil,hoje:telaHoje,cal:telaCal,como:telaComo,modelos:telaModelos,info:telaInfo}[view];
  const corpo=tela();
  $('#app').innerHTML='<div class="sl-tit"><div><h1>'+TIT[view][0]+'</h1><div class="sl-sub">'+TIT[view][1]()+'</div></div>'+(view==='hoje'?window._daynav:'')+'</div>'+corpo+
  '<div class="foot"><span id="salvo">As marcações são salvas na planilha (aba REGISTRO_PROGRAMA).</span>'+
    '<button class="btn" id="exp">'+ic('baixar')+' Exportar registro (planilha .csv)</button><button class="btn" onclick="window.print()">'+ic('imprimir')+' Imprimir</button></div>'+'<div class="sl-rod"><span>Rotina AET</span><svg viewBox="0 0 386 24" aria-hidden="true" fill="none" stroke="#3a3a3a" stroke-width="1.1"><path d="M0 2.5 H284 L292 21.5 H0"/><path d="M288 2.5 H308 L316 21.5 H296 Z M318 2.5 H334 L342 21.5 H326 Z M344 2.5 H356 L364 21.5 H352 Z"/></svg></div>';
}

/* ---------- eventos ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  view=b.dataset.v;render();scrollTo(0,0);
});
function agora(){const d=new Date();return brc(iso(d))+' às '+pad(d.getHours())+':'+pad(d.getMinutes())}
document.addEventListener('click',e=>{
  const ap=e.target.closest('a[href="#pend"]');
  if(ap){e.preventDefault();view='pend';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='pend'));render();scrollTo(0,0);return}
  const el=e.target;
  if(el.matches('.chk')){
    const id=el.closest('.task').dataset.id;
    if(el.checked){
      state.done[id]={por:NOME+(EMAIL?' ('+EMAIL+')':''),em:agora(),obs:''};
    }else delete state.done[id];
    save();
    const box=el.closest('.task'),aberto=!box.querySelector('.how').hidden;
    render();
    const nb=document.querySelector('.task[data-id="'+CSS.escape(id)+'"]');
    if(nb&&aberto)nb.querySelector('.how').hidden=false;
    if(el.checked)toast('Tarefa marcada como feita');
  }
  if(el.closest('[data-how]')){const how=el.closest('.task').querySelector('.how');how.hidden=!how.hidden}
  if(el.closest('[data-modelo]')){const mb=el.closest('.task').querySelector('.modelo-box');mb.hidden=!mb.hidden}
  if(el.dataset.nav!==undefined){const n=+el.dataset.nav;dia=n===0?diaPadrao():DIAS_UTEIS[DIAS_UTEIS.indexOf(dia)+n];render()}
  if(el.dataset.goto){e.preventDefault();dia=el.dataset.goto;view='hoje';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='hoje'));render();scrollTo(0,0)}
  const k=el.closest('[data-kpi]');
  if(k&&k.dataset.kpi){const v=k.dataset.kpi;
    if(v.startsWith('dia:')){dia=v.slice(4);render();document.getElementById('sec-dia').scrollIntoView({behavior:'smooth',block:'start'})}
    else{const t=document.getElementById(v);if(t){const d=t.nextElementSibling;if(d&&d.tagName==='DETAILS')d.open=true;t.scrollIntoView({behavior:'smooth',block:'start'})}}}
  if(el.closest('[data-curso-add]')){
    const nome=$('#cNome').value.trim(),origem=$('#cOrig').value.trim(),prazo=$('#cPrazo').value;
    if(!nome||!prazo){toast('Preencha o nome do curso e o prazo');return}
    state.cursos=state.cursos||[];state.cursos.push({id:Date.now().toString(36),nome,origem,prazo});save();cursoTasks();render();toast('Curso registrado – tarefa de prazo criada');
  }
  const cd=el.closest('[data-curso-del]');
  if(cd&&confirm('Remover este curso do controle? A tarefa de prazo também será removida.')){state.cursos=(state.cursos||[]).filter(c=>c.id!==cd.dataset.cursoDel);save();cursoTasks();render()}
  if(el.dataset.copy)copiar(COPIA[el.dataset.copy]);
  const lp=el.closest('[data-lista-print]');if(lp)imprimirLista(lp.dataset.listaPrint);
  if(el.id==='exp')exportar();
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-mil]')){const [n,k]=e.target.dataset.mil.split('|');milSt(n)[k]=e.target.checked?agora():false;save();const y=scrollY;render();scrollTo(0,y)}if(e.target.id==='semSel'){window._sem=e.target.value;render()}});
document.addEventListener('input',e=>{
  if(e.target.matches('[data-milobs]')){milSt(e.target.dataset.milobs).obs=e.target.value;save()}
  if(e.target.matches('[data-obs]')){const id=e.target.closest('.task').dataset.id;state.notas=state.notas||{};state.notas[id]=e.target.value;if(state.done[id])state.done[id].obs=e.target.value;save()}
});
function copiar(txt){
  const ok=()=>toast('Copiado! Agora é só colar (Ctrl+V)');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,()=>fallback());else fallback();
  function fallback(){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('Não deu para copiar: selecione o texto e use Ctrl+C')}t.remove()}
}
function exportar(){
  const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
  const lin=[['Data','Dia','Tipo','Atividade','Feito','Quem fez','Quando','Observação'].map(q).join(';')];
  for(const t of tasks){const d=state.done[t.id];lin.push([br(t.date),DIAS[dow(t.date)],t.tipo,t.titulo,d?'SIM':'NÃO',d&&d.por,d&&d.em,nota(t.id)].map(q).join(';'))}
  lin.push('');lin.push(['Turma','Nº','P/G','Nome','Lotação','APCAF','Data CF','Resultado CF',...MCHK.map(x=>x[1]),'Observação'].map(q).join(';'));
  for(const m of MIL){const st=milSt(m.n);lin.push([br(m.ini)+' a '+br(m.fim),m.n,m.pg,m.nome,m.loc,m.apcaf,m.cfd,m.cfr,...MCHK.map(([k])=>st[k]?'SIM ('+st[k]+')':'NÃO'),st.obs||m.obs].map(q).join(';'))}
  const blob=new Blob(['\ufeff'+lin.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='registro-rotina-AET-'+iso(new Date())+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function linhasRegistro(){
  const out=[];
  for(const t of tasks){const d=state.done[t.id],n=nota(t.id);if(d||n)out.push([t.id,'Tarefa',br(t.date),t.tipo+' – '+t.titulo,d?'SIM':'NÃO',d?(d.por||''):'',d?(d.em||''):'',n])}
  for(const m of MIL){const st=(state.mil||{})[m.n];if(!st)continue;const feitos=MCHK.filter(([k])=>st[k]).map(([k,l])=>l+' ('+st[k]+')');if(feitos.length||st.obs)out.push(['mil|'+m.n,'Militar TPB',br(m.ini),m.pg+' '+m.nome+' – nº '+m.n,feitos.length===MCHK.length?'SIM':'PARCIAL',NOME,feitos.join('; '),st.obs||''])}
  for(const c of (state.cursos||[]))out.push(['curso|'+c.id,'Curso',br(c.prazo),'Curso '+c.nome+(c.origem?' ('+c.origem+')':''),'','','',''] );
  return out;
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
render();
</script>
